version: '3.9'

services:
  centrifugo:
    image: centrifugo/centrifugo:v5.2.0
    environment:
      CENTRIFUGO_ALLOWED_ORIGINS: "http://localhost http://localhost:3000 http://localhost:3001 http://localhost:8080 http://localhost:9000"
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    expose:
      - 8000

  prometheus:
    build: metrics/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    volumes:
      - metrics-data:/prometheus

  grafana:
    user: "472"
    image: grafana/grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./metrics/grafana/provisioning/:/etc/grafana/provisioning/
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      web-app:
        condition: service_healthy
      centrifugo:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./www
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        INTERNAL_API_BASE_URL: http://web-app:5000
        NEXT_PUBLIC_CENTRIFUGO_WS_URL: ws://localhost/connection/websocket
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/toro" ]
      interval: 5s
      timeout: 10s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: ./www
    depends_on:
      web-app:
        condition: service_healthy
    restart: unless-stopped

  web-app:
    build: ./
    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres-db:5432
      PORT: 5000
      ROCKET_ADDRESS: 0.0.0.0
      RUST_LOG: info
      CENTRIFUGO_HTTP_URL: http://centrifugo:8000
      CENTRIFUGO_WS_URL: ws://centrifugo:8000/connection/websocket
      CENTRIFUGO_API_KEY: api_key
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/toro" ]
      interval: 5s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - tmp:/app/tmp
      - ./tmp:/app/tmp
    depends_on:
      centrifugo:
        condition: service_started
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:17.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"

volumes:
  grafana_data: {}
  metrics-data: {}
  postgres-data:
    driver: local
  tmp:
    driver: local

networks:
  default:
    driver: bridge
